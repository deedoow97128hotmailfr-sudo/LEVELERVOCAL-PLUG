name: Build VST3 (Windows 32 + 64 bits)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: GORYL-Vocal-Leveler-VST3-${{ matrix.arch }}
          path: build/GorylVocalLeveler_artefacts/Release/VST3/
